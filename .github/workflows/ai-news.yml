name: AI News Fetch

on:
  # cron による自動実行は無効化(運用はClaude Codeの /daily-news で手動更新)
  # 自動運用に切り替えたい場合は下記コメントを外す:
  # schedule:
  #   - cron: "0 22 * * 0-4"  # 平日(月〜金) JST 7:00 = UTC 22:00 前日
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Fetch AI news
        run: python ai-news/scripts/fetch.py

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ai-news/data/articles.json
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "chore(ai-news): update articles $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi
